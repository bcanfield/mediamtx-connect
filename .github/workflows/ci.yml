name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
    # `edited` is here for the pr-title job, so a retitle re-checks without a
    # new commit. Listing types at all overrides the default three, hence the
    # explicit list. The expensive jobs opt out of `edited` individually.
    types: [opened, synchronize, reopened, edited]

jobs:
  # Lives in CI rather than its own workflow on purpose: the smallhours agent
  # loop gates on this workflow by name (.smallhours.yml `ci_workflow: CI`,
  # agent-loop.yml `workflow_run: workflows: [CI]`). A title check outside CI
  # is invisible to it — the loop would read CI green, think the PR is ready,
  # and never fire auto-fix on a title it can't see. Here, a bad title fails
  # CI, which is a signal the loop already knows how to repair.
  pr-title:
    name: Conventional commit format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert'
          if printf '%s' "$TITLE" | grep -qE "^($types)(\([a-z0-9 ,._/-]+\))?!?: .+"; then
            echo "OK: $TITLE"
            exit 0
          fi
          cat <<EOF
          Title: "$TITLE"

          main is squash-merged, so this title becomes the commit subject
          semantic-release parses. Retitle the PR as
          <type>[(scope)][!]: <description>, where type is one of:
          $types

          Only feat, fix, perf and revert cut a release; ! or a
          BREAKING CHANGE footer cuts a major. Everything else lands in main
          without a version bump, which is usually what you want for docs,
          tests, and tooling.
          EOF
          exit 1

  # Docs-only PRs don't need MediaMTX, Docker, or a browser. Gates only the
  # expensive jobs (E2E, image smoke), and only on pull_request — pushes to
  # main/beta always run everything, because release.yml treats this workflow's
  # conclusion on main as the "is main shippable" signal.
  # A skipped required check reports success to branch protection; a skipped
  # *workflow* would never report at all, which is why this is a job-level `if`
  # rather than a top-level `paths-ignore`.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this PR touch anything but docs?
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Empty on push events, where the downstream jobs run unconditionally
          # anyway. Fail open — an unknown base means run everything.
          if [ -z "$BASE_SHA" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qvE '(^docs/|\.md$|^LICENSE$)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    # A retitle changes no code, so don't rebuild for it. `test` needs this job
    # and skips with it; `image-smoke` carries its own copy of the guard.
    # Empty on push, where this is always true.
    if: github.event.action != 'edited'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Turborepo's cache lives in .turbo, which dies with the runner — without
      # this every run recomputes lint/typecheck/test/build for every package
      # from cold, changed or not. Keyed per-commit so each run starts from the
      # newest ancestor's cache rather than a fixed snapshot.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            .eslintcache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: i18n key parity + README translation sync
        run: pnpm i18n:check
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    env:
      # Hermetic e2e data dir seeded from committed fixtures. Pinned so the
      # seeder and the webserver agree; kept separate from the dev dir
      # (.dev-data) that env.ts defaults to.
      DATA_DIR: ./test-results/e2e-data/data
      MEDIAMTX_RECORDINGS_DIR: ./test-results/e2e-data/recordings
      MEDIAMTX_SCREENSHOTS_DIR: ./test-results/e2e-data/screenshots
      BACKEND_SERVER_MEDIAMTX_URL: http://127.0.0.1
      REMOTE_MEDIAMTX_URL: http://localhost

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-e2e-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-e2e-
            turbo-${{ runner.os }}-build-
      - name: Install ffmpeg
        # Not just cron noise-suppression: streams.spec.ts's "taking a snapshot
        # on demand" asserts the "Snapshot captured" toast, which spawns ffmpeg
        # against the RTSP feed. Removing this turns that test red.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Seed test fixtures
        run: node scripts/seed-fixtures.mjs --target ./test-results/e2e-data
      - name: Start MediaMTX with fake streams
        run: |
          docker compose -f docker-compose.dev.yml up -d
          node scripts/wait-for-mediamtx.mjs
      - name: MediaMTX logs if it never readied
        if: failure()
        run: |
          docker logs mediamtx 2>&1 | tail -30
          docker logs fake-streams 2>&1 | tail -30
      # Chromium only — the other four projects are nightly (e2e-nightly.yml).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # A turbo cache hit from the build job makes this a restore, not a rebuild.
      - name: Build application
        run: pnpm build
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== MediaMTX logs ==="
          docker logs mediamtx 2>&1 | tail -50
          echo "=== Fake streams logs ==="
          docker logs fake-streams 2>&1 | tail -50
      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  image-smoke:
    name: Docker image smoke
    runs-on: ubuntu-latest
    needs: changes
    if: (github.event_name == 'push' || needs.changes.outputs.code == 'true') && github.event.action != 'edited'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: mediamtx-connect:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: |
          docker run -d --name mediamtx-connect-smoke -p 3000:3000 \
            -e BACKEND_SERVER_MEDIAMTX_URL=http://localhost \
            -e REMOTE_MEDIAMTX_URL=http://localhost \
            -e MEDIAMTX_API_PORT=9997 \
            -e MEDIAMTX_RECORDINGS_DIR=/recordings \
            -e MEDIAMTX_SCREENSHOTS_DIR=/screenshots \
            mediamtx-connect:smoke
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /tmp/health.json 2>/dev/null; then
              echo "Health endpoint returned 200"
              cat /tmp/health.json
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Health endpoint never returned 200"
              exit 1
            fi
            sleep 2
          done
      - name: Assert health response shape
        run: |
          grep -q '"status":"healthy"' /tmp/health.json
      - name: Container logs on failure
        if: failure()
        run: docker logs mediamtx-connect-smoke 2>&1 | tail -200
      - name: Cleanup
        if: always()
        run: docker rm -f mediamtx-connect-smoke || true

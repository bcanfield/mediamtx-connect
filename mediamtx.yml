# ##############################################
# MediaMTX configuration for mediamtx-connect
# ##############################################
#
# `mediamtx.dev.yml` (used by `pnpm dev`) duplicates the base settings below —
# api, hls, webrtc, webrtcAdditionalHosts, pathDefaults, the `all_others`
# catch-all — because MediaMTX has no include/merge mechanism. Change any of
# them here and mirror the change there, or dev silently drifts from prod.

# API settings
api: yes
apiAddress: :9997

# Allow API access from any IP (needed for Docker bridge network)
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof
      - action: playback
      - action: read
      - action: publish

# HLS settings
hls: yes
hlsAddress: :8888

# WebRTC settings (WHEP playback)
webrtc: yes
webrtcAddress: :8889
# In Docker, MediaMTX gathers ICE candidates from its own container interfaces,
# which are addresses the browser can't route to — WHEP negotiates and then never
# connects. Advertising the host the browser actually uses fixes that, and our
# docker-compose.yml owns that value: it passes REMOTE_MEDIAMTX_HOST (default
# 127.0.0.1) as MTX_WEBRTCADDITIONALHOSTS. Deliberately commented out — an env
# var beats a config key, so a value set here would be silently overridden by a
# compose default nobody saw. Running this config WITHOUT our compose? Uncomment
# it and put the browser-reachable host there.
# webrtcAdditionalHosts: [127.0.0.1]

# Path defaults (recording settings)
pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S

# Allow any stream path
paths:
  all_others:
